<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rybaproxy · 管理面板（设计稿 C · 花园午后）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Source+Sans+3:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F1E8; --ink: #2E3A33; --ink-soft: #5A665E;
    --accent: #C67B5C; --accent-soft: #E8CFC2;
    --mint: #8FA888; --mint-soft: #DCE6D9; --mint-deep: #5F7E5A;
    --stone: #E3DCCF; --stone-deep: #D6CEBF;
    --card: #FBF8F1; --line: #D9D2C3; --danger: #B85454;
    --shadow: 0 1px 2px rgba(46,58,51,.06), 0 8px 24px rgba(46,58,51,.08);
    --radius: 14px; --radius-sm: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: "Source Sans 3", system-ui, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { font-family: "Playfair Display", Georgia, serif; font-weight: 700; margin: 0; }
  .num { font-family: "Space Grotesk", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .shell { max-width: 1280px; margin: 0 auto; padding: 32px 28px 64px; }
  .hero { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  @media (max-width: 1024px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 680px) { .grid { grid-template-columns: 1fr; } }
  .span-2 { grid-column: span 2; }
  .span-3 { grid-column: span 3; }
  @media (max-width: 680px) { .row-34 { grid-template-columns: 1fr !important; } }
  @media (max-width: 1024px) { .span-3 { grid-column: span 2; } }
  @media (max-width: 680px) { .span-2, .span-3 { grid-column: span 1; } }

  ryba-card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px 26px; box-shadow: var(--shadow); position: relative; overflow: hidden; min-width: 0; }
  ryba-card::before { content: ""; position: absolute; inset: 0; pointer-events: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'><g fill='none' stroke='%238FA888' stroke-width='0.6' opacity='0.25'><path d='M60 10 C30 30 30 90 60 110 C90 90 90 30 60 10 Z'/><path d='M60 10 L60 110'/><path d='M60 40 L40 55 M60 40 L80 55 M60 70 L42 82 M60 70 L78 82'/></g></svg>"); background-size: 120px 120px; background-repeat: repeat; opacity: .45; transition: opacity .4s ease; }
  ryba-card:hover::before { opacity: .75; }
  @media (prefers-reduced-motion: reduce) { ryba-card::before { transition: none; } }

  ryba-card[data-p="1"]::before { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><g fill='none' stroke='%23C67B5C' stroke-width='0.7' opacity='0.22'><circle cx='50' cy='50' r='8'/><circle cx='50' cy='50' r='20'/><circle cx='50' cy='50' r='34'/><path d='M50 16 L50 84 M16 50 L84 50'/></g></svg>"); }
  ryba-card[data-p="2"]::before { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'><g fill='%238FA888' opacity='0.18'><circle cx='10' cy='10' r='2'/><circle cx='30' cy='20' r='1.5'/><circle cx='55' cy='12' r='2.2'/><circle cx='70' cy='35' r='1.8'/><circle cx='20' cy='50' r='2'/><circle cx='45' cy='55' r='1.6'/><circle cx='65' cy='65' r='2.4'/><circle cx='35' cy='72' r='1.9'/></g></svg>"); }
  ryba-card[data-p="3"]::before { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90' viewBox='0 0 90 90'><g fill='none' stroke='%235F7E5A' stroke-width='0.8' opacity='0.2'><path d='M0 45 Q22 20 45 45 T90 45'/><path d='M0 60 Q22 35 45 60 T90 60'/><path d='M0 30 Q22 5 45 30 T90 30'/></g></svg>"); }
  ryba-card .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  ryba-card .card-title { font-family: "Playfair Display", serif; font-size: 1.25rem; }
  ryba-card .card-eyebrow { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }

  ryba-stat { display: block; }
  ryba-stat .stat-value { font-size: 2.4rem; line-height: 1; color: var(--ink); }
  ryba-stat .stat-label { font-size: .85rem; color: var(--ink-soft); margin-top: 6px; }
  ryba-stat .stat-trend { display: inline-flex; align-items: center; gap: 4px; font-size: .78rem; color: var(--mint); margin-top: 8px; }
  ryba-stat .spark { width: 100%; height: 34px; margin-top: 10px; }

  .table { width: 100%; border-collapse: collapse; font-size: .9rem; table-layout: fixed; }
  .table th { text-align: left; font-weight: 600; color: var(--ink-soft); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  .table td { padding: 10px 8px; border-bottom: 1px solid var(--stone-deep); vertical-align: middle; }
  .table tr:last-child td { border-bottom: none; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: .72rem; font-weight: 600; }
  .pill.on { background: var(--mint-soft); color: #3F5A4A; }
  .pill.off { background: #ECE4E0; color: #7A5A50; }
  .pill.proto { background: var(--accent-soft); color: #7A4A36; }
  .row-actions { display: flex; gap: 6px; }
  .row-actions button { background: transparent; border: 1px solid var(--line); color: var(--ink-soft); padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: .78rem; transition: all .15s ease; margin-right: 4px; }
  .row-actions button:hover { border-color: var(--accent); color: var(--accent); }
  .row-actions button.danger:hover { border-color: var(--danger); color: var(--danger); }

  .form-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .form-row input, .form-row select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font: inherit; color: var(--ink); min-width: 0; flex: 1 1 140px; }
  .btn { padding: 9px 16px; border: none; border-radius: 8px; cursor: pointer; font: inherit; font-weight: 600; background: var(--accent); color: #fff; transition: transform .1s ease, box-shadow .15s ease; }
  .btn:hover { box-shadow: 0 4px 12px rgba(198,123,92,.35); }
  .btn:active { transform: translateY(1px); }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn.sm { padding: 6px 12px; font-size: .82rem; }

  .empty { text-align: center; padding: 28px 12px; color: var(--ink-soft); }
  .empty svg { margin-bottom: 8px; opacity: .6; }

  .skel { background: linear-gradient(90deg, var(--stone) 0%, var(--stone-deep) 50%, var(--stone) 100%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px; height: 14px; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .skel { animation: none; } }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: .88rem; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 50; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  /* modal */
  ryba-modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(46,58,51,.35); z-index: 40; padding: 20px; }
  ryba-modal.open { display: flex; }
  ryba-modal .modal-card { background: var(--card); border-radius: var(--radius); padding: 26px; width: min(520px, 100%); box-shadow: var(--shadow); border: 1px solid var(--line); }
  ryba-modal .modal-title { font-family: "Playfair Display", serif; font-size: 1.3rem; margin-bottom: 14px; }
  ryba-modal .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  /* heatmap tooltip */
  #heatmap { display: grid; grid-template-columns: repeat(15, 1fr); gap: 5px; }
  #heatmap .cell { aspect-ratio: 1/1; border-radius: 3px; cursor: pointer; transition: transform .12s; position: relative; }
  #heatmap .cell:hover { transform: scale(1.2); z-index: 2; }
  #hmTip { position: fixed; pointer-events: none; background: var(--ink); color: #fff; padding: 6px 10px; border-radius: 6px; font-size: .75rem; opacity: 0; transition: opacity .15s; z-index: 60; white-space: nowrap; }

  header.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  header.top .brand { display: flex; align-items: center; gap: 12px; }
  header.top .brand-mark { width: 38px; height: 38px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; color: #fff; font-family: "Playfair Display", serif; font-size: 1.15rem; }
  header.top h1 { font-size: 1.6rem; }
  header.top .meta { font-size: .8rem; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <div class="brand-mark">R</div>
      <div>
        <h1>rybaproxy</h1>
        <div class="meta">家庭代理 · 管理面板</div>
      </div>
    </div>
    <div class="meta num" id="clock">--:--</div>
  </header>

  <section class="hero">
    <ryba-card id="heroCard">
      <div class="card-head">
        <div>
          <div class="card-eyebrow">实时 · 活跃会话</div>
          <div class="card-title">家中流量总览</div>
        </div>
        <span class="pill on">运行中</span>
      </div>
      <div class="grid" style="grid-template-columns: repeat(4,1fr); gap:16px;">
        <ryba-stat value="42" label="当前活跃会话" trend="+3 较昨日"></ryba-stat>
        <ryba-stat value="1.2 GB" label="今日上行" trend=""></ryba-stat>
        <ryba-stat value="8.7 GB" label="今日下行" trend=""></ryba-stat>
        <ryba-stat value="3" label="错误 / 丢弃" trend="0 丢弃"></ryba-stat>
      </div>
    </ryba-card>
  </section>

  <div class="row-34" style="display:grid; grid-template-columns: minmax(0,4fr) minmax(0,6fr); gap:20px; margin-bottom:20px;">
    <ryba-card>
      <div class="card-head">
        <div>
          <div class="card-eyebrow">上游</div>
          <div class="card-title">出口节点</div>
        </div>
        <button class="btn sm" id="openUpstream">+ 新建</button>
      </div>
      <table class="table" id="upstreamTable">
        <colgroup><col style="width:100px"><col style="width:64px"><col style="width:120px"><col style="width:56px"><col style="width:60px"></colgroup>
        <thead><tr><th>名称</th><th>类型</th><th>地址</th><th>状态</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </ryba-card>

    <ryba-card>
      <div class="card-head">
        <div>
          <div class="card-eyebrow">路由</div>
          <div class="card-title">规则列表</div>
        </div>
        <button class="btn ghost" id="openRule">+ 添加规则</button>
      </div>
      <table class="table" id="ruleTable">
        <colgroup><col style="width:64px"><col style="width:150px"><col style="width:130px"><col style="width:60px"><col style="width:70px"><col style="width:60px"><col style="width:110px"></colgroup>
        <thead><tr><th>优先级</th><th>域名</th><th>IP/CIDR</th><th>端口</th><th>协议</th><th>上游</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      <div class="empty" id="ruleEmpty" style="display:none;">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 14h32M8 24h24M8 34h28"/></svg>
        <div>还没有路由规则</div>
        <div style="font-size:.8rem; margin-top:4px;">点击「添加规则」开始分流</div>
      </div>
    </ryba-card>
  </div>

  <div class="grid">
    <ryba-card class="span-3">
      <div class="card-head">
        <div>
          <div class="card-eyebrow">会话</div>
          <div class="card-title">最近连接</div>
        </div>
      </div>
      <table class="table" id="sessionTable">
        <colgroup><col style="width:70px"><col style="width:130px"><col style="width:200px"><col style="width:70px"><col style="width:80px"><col style="width:80px"></colgroup>
        <thead><tr><th>协议</th><th>客户端</th><th>目标</th><th>状态</th><th>上行</th><th>下行</th></tr></thead>
        <tbody></tbody>
      </table>
    </ryba-card>

    <ryba-card class="span-3">
      <div class="card-head">
        <div>
          <div class="card-eyebrow">流量</div>
          <div class="card-title">最近 30 天</div>
        </div>
        <div style="font-size:.8rem;color:var(--ink-soft);">方块颜色 = 当日流量</div>
      </div>
      <div id="heatmap"></div>
      <div style="display:flex; align-items:center; gap:6px; margin-top:12px; font-size:.72rem; color:var(--ink-soft);">
        <span>少</span>
        <span style="width:12px;height:12px;background:#E8E2D4;border-radius:2px;"></span>
        <span style="width:12px;height:12px;background:#C9D6C2;border-radius:2px;"></span>
        <span style="width:12px;height:12px;background:#8FA888;border-radius:2px;"></span>
        <span style="width:12px;height:12px;background:#5F7E5A;border-radius:2px;"></span>
        <span>多</span>
      </div>
    </ryba-card>
  </div>
</div>

<!-- modals -->
<ryba-modal id="mUpstream">
  <div class="modal-card">
    <div class="modal-title">新建出口节点</div>
    <div style="display:grid; gap:12px;">
      <div><label style="font-size:.8rem;color:var(--ink-soft);">名称</label><input name="name" placeholder="如 office-vpn" style="width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;"></div>
      <div><label style="font-size:.8rem;color:var(--ink-soft);">类型</label><select name="type" style="width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;"><option value="direct">direct（直连）</option><option value="http">http</option><option value="socks5">socks5</option></select></div>
      <div style="display:grid; grid-template-columns:2fr 1fr; gap:10px;">
        <div><label style="font-size:.8rem;color:var(--ink-soft);">主机</label><input name="host" placeholder="10.0.0.5" style="width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;"></div>
        <div><label style="font-size:.8rem;color:var(--ink-soft);">端口</label><input name="port" type="number" placeholder="8080" style="width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" data-close>取消</button>
      <button class="btn" id="saveUpstream">保存</button>
    </div>
  </div>
</ryba-modal>

<ryba-modal id="mRule">
  <div class="modal-card">
    <div class="modal-title" id="ruleModalTitle">添加路由规则</div>
    <div style="display:grid; gap:12px;">
      <div>
        <label style="font-size:.8rem;color:var(--ink-soft);">域名模式</label>
        <input name="domain_pattern" placeholder="如 *.example.com（留空则不匹配域名）" style="width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;">
      </div>
      <div>
        <label style="font-size:.8rem;color:var(--ink-soft);">IP / CIDR</label>
        <input name="ip_cidr" placeholder="如 192.168.0.0/16（留空则不匹配 IP）" style="width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;">
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;">
        <div><label style="font-size:.8rem;color:var(--ink-soft);">端口</label><input name="port" type="number" placeholder="0 = 任意" style="width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;"></div>
        <div><label style="font-size:.8rem;color:var(--ink-soft);">优先级</label><input name="priority" type="number" value="100" style="width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;"></div>
        <div><label style="font-size:.8rem;color:var(--ink-soft);">上游 ID</label><input name="upstream_id" type="number" value="0" style="width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;"></div>
      </div>
      <div>
        <label style="font-size:.8rem;color:var(--ink-soft);">协议</label>
        <select name="protocol" style="width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;">
          <option value="any">any（全部）</option><option value="http">http</option><option value="socks5">socks5</option>
        </select>
      </div>
      <p style="font-size:.75rem;color:var(--ink-soft);margin:0;">域名与 IP 至少填一项；优先级越小越先匹配。</p>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" data-close>取消</button>
      <button class="btn" id="saveRule">保存</button>
    </div>
  </div>
</ryba-modal>

<ryba-modal id="mConfirm">
  <div class="modal-card">
    <div class="modal-title" id="confirmTitle">确认删除？</div>
    <p style="color:var(--ink-soft); margin:0 0 8px;">此操作不可撤销。</p>
    <div class="modal-actions">
      <button class="btn ghost" data-close>取消</button>
      <button class="btn" id="confirmOk" style="background:var(--danger);">删除</button>
    </div>
  </div>
</ryba-modal>
<div id="hmTip"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Web Components ---------- */
class RybaCard extends HTMLElement { constructor(){ super(); } }
customElements.define('ryba-card', RybaCard);

class RybaStat extends HTMLElement {
  static get observedAttributes(){ return ['value','label','trend']; }
  constructor(){ super(); this._rendered=false; }
  connectedCallback(){ if(!this._rendered){ this._rendered=true; this.render(); } }
  attributeChangedCallback(){ if(this._rendered) this.render(); }
  render(){
    const value = this.getAttribute('value') ?? '';
    const label = this.getAttribute('label') ?? '';
    const trend = this.getAttribute('trend') ?? '';
    this.innerHTML = `
      <div class="stat-value num">${value}</div>
      <div class="stat-label">${label}</div>
      ${trend ? `<div class="stat-trend">↗ ${trend}</div>` : ''}
      <svg class="spark" viewBox="0 0 120 36" preserveAspectRatio="none">
        <polyline fill="none" stroke="#8FA888" stroke-width="1.6" points="${this._spark()}"/>
      </svg>`;
  }
  _spark(){ const pts=[]; let v=18; for(let i=0;i<12;i++){ v += (Math.random()-0.5)*6; v=Math.max(6,Math.min(30,v)); pts.push(`${i*11},${36-v}`); } return pts.join(' '); }
}
customElements.define('ryba-stat', RybaStat);

class RybaModal extends HTMLElement {
  constructor(){ super(); }
  connectedCallback(){
    this.addEventListener('click', e => { if(e.target === this || e.target.hasAttribute('data-close')) this.close(); });
  }
  open(){ this.classList.add('open'); }
  close(){ this.classList.remove('open'); }
}
customElements.define('ryba-modal', RybaModal);

/* ---------- Data ---------- */
let upstreams = [
  { name: 'home-direct', type: 'direct', host: '-', port: '-', enabled: true },
  { name: 'office-vpn', type: 'http', host: '10.0.0.5', port: 8080, enabled: true },
  { name: 'backup-socks', type: 'socks5', host: '192.168.1.9', port: 1080, enabled: false },
];
let rules = [
  { priority: 10, domain: '*.google.com', ip: '', port: 0, proto: 'any', upstream: 1 },
  { priority: 50, domain: '', ip: '192.168.0.0/16', port: 0, proto: 'http', upstream: 0 },
  { priority: 100, domain: '*.internal.lan', ip: '', port: 0, proto: 'any', upstream: 2 },
];
const sessions = [
  { proto: 'http', client: '192.168.1.23', target: 'api.example.com:443', status: 'active', up: '12 KB', down: '1.4 MB' },
  { proto: 'socks5', client: '192.168.1.41', target: 'cdn.fastly.net:443', status: 'active', up: '3 KB', down: '8.2 MB' },
  { proto: 'http', client: '192.168.1.7', target: 'updates.apple.com:443', status: 'closed', up: '0', down: '240 KB' },
  { proto: 'socks5', client: '192.168.1.23', target: 'github.com:443', status: 'active', up: '8 KB', down: '3.1 MB' },
];

/* ---------- Render ---------- */
function renderUpstreams() {
  const tb = document.querySelector('#upstreamTable tbody');
  tb.innerHTML = '';
  upstreams.forEach((u,i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${u.name}</td>
      <td><span class="pill proto">${u.type}</span></td>
      <td class="num">${u.host}${u.port!=='-'?':'+u.port:''}</td>
      <td><span class="pill ${u.enabled?'on':'off'}">${u.enabled?'启用':'停用'}</span></td>
      <td class="row-actions">
        <button class="danger" data-del="${i}">删除</button>
      </td>`;
    tr.querySelector('[data-del]').addEventListener('click', () => confirmDelete(() => { upstreams.splice(i,1); renderUpstreams(); toast('已删除节点'); }));
    tb.appendChild(tr);
  });
}

function renderRules() {
  const tb = document.querySelector('#ruleTable tbody');
  const empty = document.getElementById('ruleEmpty');
  const table = document.querySelector('#ruleTable');
  tb.innerHTML = '';
  if (!rules.length) { empty.style.display='block'; table.style.display='none'; return; }
  empty.style.display='none'; table.style.display='';
  rules.forEach((r,i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="num">${r.priority}</td>
      <td>${r.domain || '—'}</td>
      <td class="num">${r.ip || '—'}</td>
      <td class="num">${r.port || '*'}</td>
      <td><span class="pill proto">${r.proto}</span></td>
      <td class="num">${r.upstream}</td>
      <td class="row-actions">
        <button data-edit="${i}">编辑</button>
        <button class="danger" data-del="${i}">删除</button>
      </td>`;
    tr.querySelector('[data-edit]').addEventListener('click', () => openRuleEditor(i));
    tr.querySelector('[data-del]').addEventListener('click', () => confirmDelete(() => { rules.splice(i,1); renderRules(); toast('已删除规则'); }));
    tb.appendChild(tr);
  });
}

function renderSessions() {
  const tb = document.querySelector('#sessionTable tbody');
  tb.innerHTML = '';
  sessions.forEach(s => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><span class="pill proto">${s.proto}</span></td>
      <td class="num">${s.client}</td>
      <td>${s.target}</td>
      <td><span class="pill ${s.status==='active'?'on':'off'}">${s.status==='active'?'活跃':'已关闭'}</span></td>
      <td class="num">${s.up}</td>
      <td class="num">${s.down}</td>`;
    tb.appendChild(tr);
  });
}

function renderHeatmap() {
  const box = document.getElementById('heatmap');
  const tip = document.getElementById('hmTip');
  box.innerHTML = '';
  const levels = ['#E8E2D4','#C9D6C2','#8FA888','#5F7E5A'];
  const labels = ['0–50 MB','50–200 MB','200–800 MB','800 MB+'];
  for (let i = 0; i < 30; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const v = Math.random();
    const lvl = v < 0.35 ? 0 : v < 0.6 ? 1 : v < 0.85 ? 2 : 3;
    const mb = (lvl===0? Math.round(Math.random()*50) : lvl===1? 50+Math.round(Math.random()*150) : lvl===2? 200+Math.round(Math.random()*600) : 800+Math.round(Math.random()*1200));
    cell.style.background = levels[lvl];
    cell.addEventListener('mouseenter', e => {
      tip.textContent = `第 ${i+1} 天 · ${mb} MB`;
      tip.style.opacity = '1';
      const r = cell.getBoundingClientRect();
      tip.style.left = (r.left + r.width/2 - tip.offsetWidth/2) + 'px';
      tip.style.top = (r.top - 30) + 'px';
    });
    cell.addEventListener('mouseleave', () => { tip.style.opacity = '0'; });
    box.appendChild(cell);
  }
}

/* ---------- Modals ---------- */
const mUp = document.getElementById('mUpstream');
const mRule = document.getElementById('mRule');
document.getElementById('openUpstream').addEventListener('click', () => mUp.open());
document.getElementById('openRule').addEventListener('click', () => openRuleEditor(-1));

function openRuleEditor(i) {
  editingRule = i;
  const m = mRule;
  const set = (n,v) => { const el = m.querySelector(`[name="${n}"]`); if(el) el.value = v; };
  document.getElementById('ruleModalTitle').textContent = i < 0 ? '添加路由规则' : '编辑路由规则';
  if (i < 0) {
    set('domain_pattern',''); set('ip_cidr',''); set('port',''); set('priority',100); set('upstream_id',0); set('protocol','any');
  } else {
    const r = rules[i];
    set('domain_pattern', r.domain); set('ip_cidr', r.ip); set('port', r.port); set('priority', r.priority); set('upstream_id', r.upstream); set('protocol', r.proto);
  }
  m.open();
}

document.getElementById('saveUpstream').addEventListener('click', () => {
  const m = mUp; const get = n => m.querySelector(`[name="${n}"]`).value;
  upstreams.push({ name: get('name')||'new-node', type: get('type'), host: get('host')||'-', port: parseInt(get('port')||0)||'-', enabled: true });
  renderUpstreams(); m.close(); toast('已创建节点');
});

let editingRule = -1;
function openRuleEditor(i) {
  editingRule = i;
  const m = mRule;
  const set = (n,v) => { const el = m.querySelector(`[name="${n}"]`); if(el) el.value = v; };
  document.getElementById('ruleModalTitle').textContent = i < 0 ? '添加路由规则' : '编辑路由规则';
  if (i < 0) {
    set('domain_pattern',''); set('ip_cidr',''); set('port',''); set('priority',100); set('upstream_id',0); set('protocol','any');
  } else {
    const r = rules[i];
    set('domain_pattern', r.domain); set('ip_cidr', r.ip); set('port', r.port); set('priority', r.priority); set('upstream_id', r.upstream); set('protocol', r.proto);
  }
  m.open();
}
document.getElementById('saveRule').addEventListener('click', () => {
  const m = mRule; const get = n => m.querySelector(`[name="${n}"]`).value;
  const nr = { priority: parseInt(get('priority')||100), domain: get('domain_pattern'), ip: get('ip_cidr'), port: parseInt(get('port')||0), proto: get('protocol'), upstream: parseInt(get('upstream_id')||0) };
  if (editingRule < 0) {
    rules.push(nr); toast('已添加规则');
  } else {
    rules[editingRule] = nr; toast('已更新规则');
  }
  renderRules(); m.close(); editingRule = -1;
});

let _confirmCb = null;
const mConfirm = document.getElementById('mConfirm');
function confirmDelete(cb){ _confirmCb = cb; mConfirm.open(); }
document.getElementById('confirmOk').addEventListener('click', () => { if(_confirmCb){ _confirmCb(); _confirmCb=null; } mConfirm.close(); });

function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2200); }
function tick(){ const d=new Date(); document.getElementById('clock').textContent = d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}); }
setInterval(tick,1000); tick();

document.querySelectorAll("ryba-card").forEach((c,i)=>c.setAttribute("data-p", i%4));
renderUpstreams(); renderRules(); renderSessions(); renderHeatmap();
</script>
</body>
