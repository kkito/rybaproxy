# nginx front-end for rybaproxy (web admin + optional stream proxy)
events { worker_connections 1024; }

http {
    upstream ryba_web { server 127.0.0.1:9090; }
    server {
        listen 80;
        server_name _;
        location / {
            proxy_pass http://ryba_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}

stream {
    upstream ryba_http { server 127.0.0.1:8080; }
    upstream ryba_socks { server 127.0.0.1:1080; }
    server { listen 3128; proxy_pass ryba_http; }
    server { listen 1081; proxy_pass ryba_socks; }
}
